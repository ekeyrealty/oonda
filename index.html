  try{const s=await ref.get();if(!s.exists){showGate('error','Mae hasn\'t opened oonda online yet — try again a little later');return;}CLOUD.lastRemote=s.data().json;S=migrate(JSON.parse(CLOUD.lastRemote));}
  catch(e){showGate('error',niceErr(e));return;}
  CLOUD.unsub.push(ref.onSnapshot(s=>{if(!s.exists)return;CLOUD.lastRemote=s.data().json;S=migrate(JSON.parse(CLOUD.lastRemote));if(!$('#modalWrap').innerHTML&&!/input|textarea|select/i.test(document.activeElement.tagName))render();}));

  if(CLOUD.role!=='owner')return;
  const pub={listings:S.listings.filter(l=>l.status!=='withdrawn').map(l=>({id:l.id,address:l.address,city:l.city||''})),people:S.team.map(p=>({id:p.id,name:p.name}))};
  const j=JSON.stringify(pub);if(!force&&j===CLOUD.pubJson)return;CLOUD.pubJson=j;
  CLOUD.db.doc('oonda/public').set(Object.assign(pub,{updatedAt:ts0()})).catch(()=>{});
}
const RSTAT={todo:'received',doing:'doing',review:'review',done:'done'};
function syncRequestStatuses(){
  if(CLOUD.role!=='owner')return;
  CLOUD.reqs.forEach(r=>{
    if(!r.taskId)return;const t=S.tasks.find(x=>x.id===r.taskId);
    const want=t?(RSTAT[t.status]||'received'):'closed',due=t&&t.due?t.due:null;
    if(r.status!==want||(r.due||null)!==due){r.status=want;r.due=due;CLOUD.db.collection('requests').doc(r.id).update({status:want,due,updatedAt:ts0()}).catch(()=>{});}
  });
}
function ingestRequests(){
  let n=0;
  CLOUD.reqs.forEach(r=>{
    if(r.status!=='sent'||S.tasks.some(t=>t.requestId===r.id))return;
    const em=String(r.email||'').toLowerCase(),acc=CLOUD.roles[em],pid=acc&&acc.person&&P(acc.person)?acc.person:((acc&&acc.name)||r.name||em);
    let due=null,hasTime=false;
    if(r.needBy){const [y,m,d]=r.needBy.split('-').map(Number);if(r.time){const [h,mi]=r.time.split(':').map(Number);due=zoned(y,m,d,h,mi,r.tz==='PHT'?PHT:CST);hasTime=true;}else due=keyTs(r.needBy,23,59);}
    const pq=parseQuick(r.title),L=lById(r.listingId);
    const t=makeTask({title:r.title[0].toUpperCase()+r.title.slice(1),cat:pq.cat,prio:r.urgent?'high':'med',due,hasTime,tz:r.tz||'CST',listingId:L?L.id:pq.listingId,requestedBy:pid,notes:r.notes||'',requestId:r.id});
    r.taskId=t.id;r.status='received';
    CLOUD.db.collection('requests').doc(r.id).update({status:'received',taskId:t.id,due,updatedAt:ts0()}).catch(()=>{});
    notify(r.urgent?'🚨':'📥',`${r.urgent?'urgent ':''}request from ${rname(pid)}`,`${t.title}${due?' · needed '+dayWord(dayKey(due)):''}`,'auto',{task:t.id,sticky:true});
    n++;
  });
  if(n){save();if(appStarted)render();}
}
async function saveAccess(){
  const map={};
  document.querySelectorAll('[data-acc]').forEach(r=>{const em=r.querySelector('input').value.trim().toLowerCase();if(em&&em.includes('@'))map[em]={role:r.querySelector('select').value,person:r.dataset.acc,name:rname(r.dataset.acc)};});
  try{
    const b=CLOUD.db.batch();
    b.set(CLOUD.db.doc('oonda/roles'),{map,updatedAt:ts0()});
    Object.entries(map).forEach(([em,v])=>b.set(CLOUD.db.doc('access/'+em),v));
    Object.keys(CLOUD.roles).forEach(em=>{if(!map[em])b.delete(CLOUD.db.doc('access/'+em));});
    await b.commit();CLOUD.roles=map;
    toast('🔐','access saved',`${Object.keys(map).length} ${Object.keys(map).length==1?'person':'people'} can sign in now`,'auto');
  }catch(e){toast('🙈','couldn\'t save access',niceErr(e));}
}

/* requests portal (requesters + Eric's "my requests") */
const STEPS=[['sent','sent'],['received','received'],['doing','in progress'],['review','for review'],['done','done']];
function listenMine(){
  const em=CLOUD.user.email.toLowerCase();let first=true;
  CLOUD.unsub.push(CLOUD.db.collection('requests').where('email','==',em).onSnapshot(qs=>{
    const prev=CLOUD.mineMap||{},list=qs.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!first)list.forEach(r=>{if(prev[r.id]&&prev[r.id]!==r.status)announce(r);});
    first=false;CLOUD.mineMap=Object.fromEntries(list.map(r=>[r.id,r.status]));
    CLOUD.mine=list.sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));
    const pl=$('#pList');if(pl)pl.innerHTML=reqListHTML();
    if(CLOUD.role==='broker')nav();
  },e=>toast('🙈','couldn\'t load your requests',niceErr(e))));
  CLOUD.unsub.push(CLOUD.db.doc('oonda/public').onSnapshot(s=>{CLOUD.pub=s.exists?s.data():{listings:[],people:[]};const sel=$('#pq_l');if(sel){const v=sel.value;sel.innerHTML=listingOpts();sel.value=v;}},()=>{}));
}
function announce(r){
  const m={received:['📥','Mae got your request'],doing:['🎨','Mae is working on it'],review:['👀','ready for your review'],done:['🌷','done ✿'],closed:['🗂️','request closed']}[r.status];if(!m)return;
  toast(m[0],m[1],r.title,'auto','',9000);chime();
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification('oonda · '+m[1],{body:r.title});}catch(e){}}
}
const listingOpts=()=>`<option value="">— other / none —</option>${((CLOUD.pub&&CLOUD.pub.listings)||[]).map(l=>`<option value="${esc(l.id)}">${esc(l.address)}${l.city?', '+esc(l.city):''}</option>`).join('')}`;
function reqCard(r){
  const i=STEPS.findIndex(s=>s[0]===r.status),closed=r.status==='closed',dn=r.status==='done';
  return `<div class="rq"><div class="row" style="align-items:flex-start"><div style="min-width:0"><div style="font-weight:800;font-size:14.5px">${r.urgent?'🚨 ':''}${esc(r.title)}</div><div class="lab" style="margin-top:4px">${r.listing?'🏠 '+esc(r.listing)+' · ':''}needed ${r.needBy?dayWord(r.needBy):'whenever'}${r.time?' '+esc(r.time)+' '+(r.tz==='PHT'?'pht':'central'):''}${r.due&&!dn?' · Mae plans '+fD(r.due):''}</div></div>
  <span class="pill" style="background:${closed?'#eee8e4':dn?'#868a76':'#fbe3e2'};color:${dn?'#fff':'#5a4247'}">${closed?'closed':STEPS[Math.max(0,i)][1]}</span></div>
  ${closed?'':`<div class="steps">${STEPS.map((s,j)=>`<span class="${j<=i?'on':''}"><i></i>${s[1]}</span>`).join('')}</div>`}</div>`;
}
function reqListHTML(){
  const mine=CLOUD.mine||[],open=mine.filter(r=>!['done','closed'].includes(r.status)),done=mine.filter(r=>['done','closed'].includes(r.status));
  return `<div class="ch"><h3>your requests</h3><span class="lab">${open.length} open · ${done.length} finished</span></div>
  ${open.map(reqCard).join('')||'<div class="empty"><span class="hand">nothing open ✿</span>what you send shows up here, and moves as Mae works on it</div>'}
  ${done.length?`<div class="lab" style="margin:18px 0 8px 4px">finished</div>${done.slice(0,12).map(reqCard).join('')}`:''}`;
}
function reqFormHTML(){
  return `<div class="card s5"><div class="ch"><h3>send a request</h3><span class="row" style="gap:8px"><span class="lab">to mae</span>${av('me',34)}</span></div>
    <div class="f"><label>what do you need?</label><input id="pq_t" placeholder="e.g. just listed flyer + IG post"></div>
    <div class="f"><label>property</label><select id="pq_l">${listingOpts()}</select></div>
    <div class="f3"><div class="f"><label>needed by</label><input type="date" id="pq_d" value="${addKey(dayKey(Date.now(),CST),1)}"></div><div class="f"><label>time (optional)</label><input type="time" id="pq_ti"></div><div class="f"><label>zone</label><select id="pq_z">${opts([['CST','central'],['PHT','pht']],'CST')}</select></div></div>
    <div class="f"><label>details / links</label><textarea id="pq_n" rows="3" placeholder="photo folder, wording, anything Mae should know"></textarea></div>
    <label class="row" style="justify-content:flex-start;gap:8px;margin-bottom:14px;font-weight:700;font-size:13px;cursor:pointer"><input type="checkbox" id="pq_u" style="width:18px;height:18px;accent-color:#d98f97"> it's urgent</label>
    <button class="btn dark" id="pq_go" style="width:100%;justify-content:center;padding:12px" onclick="sendRequest()">💌 send to Mae</button>
    ${'Notification' in window&&Notification.permission!=='granted'?`<button class="link mt14" onclick="Notification.requestPermission().then(p=>toast(p==='granted'?'🔔':'🙈',p==='granted'?'pop-ups on':'pop-ups not allowed',p==='granted'?'you\\'ll hear when your requests move':'you can allow them in your browser settings'))">🔔 get a pop-up when things move</button>`:''}</div>`;
}
async function sendRequest(){
  const t=V('pq_t').trim();if(!t){$('#pq_t').focus();return;}
  const em=CLOUD.user.email.toLowerCase(),lid=V('pq_l'),L=((CLOUD.pub&&CLOUD.pub.listings)||[]).find(l=>l.id===lid);
  const b=$('#pq_go');b.disabled=true;b.textContent='sending…';
  try{
    await CLOUD.db.collection('requests').add({title:t,listingId:lid,listing:L?L.address:'',needBy:V('pq_d'),time:V('pq_ti'),tz:V('pq_z'),notes:V('pq_n'),urgent:$('#pq_u').checked,email:em,name:CLOUD.name||CLOUD.user.displayName||em,person:CLOUD.person||'',status:'sent',createdMs:Date.now(),createdAt:ts0()});
    toast('💌','sent to Mae','you\'ll see it move on the right','auto');$('#pq_t').value='';$('#pq_n').value='';$('#pq_ti').value='';$('#pq_u').checked=false;
  }catch(e){toast('🙈','couldn\'t send',niceErr(e));}
  b.disabled=false;b.textContent='💌 send to Mae';
}
function renderPortal(){
  const p=$('#portal');if(!p)return;const now=Date.now();
  const name=(rname(CLOUD.person)||CLOUD.name||(CLOUD.user.displayName||'there').split(' ')[0]).toLowerCase();
  p.innerHTML=`<div class="row" style="margin-bottom:26px;flex-wrap:wrap"><div class="brand" style="padding:0">${logo(36)}<b>oonda<span class="ast">𖹭</span></b></div><div class="row" style="gap:10px"><span class="lab">${esc(CLOUD.user.email)}</span><span style="cursor:pointer" onclick="acctMenu()">${av(CLOUD.person||name,44)}</span></div></div>
  <div class="lab">${fmt(now,{weekday:'long',month:'long',day:'numeric'}).toLowerCase()} · ${fT(now,CST)} ${cAb(now).toLowerCase()} · ${fT(now)} pht</div>
  <h1 class="h1">hi, ${esc(name)}<span class="ast">𖹭</span></h1><div class="sub">send Mae a request and watch it move — you'll get a pop-up whenever it changes</div>
  <div class="grid mt20">${reqFormHTML()}<div class="card s7" id="pList">${reqListHTML()}</div></div>`;
}
function pMine(){return CLOUD.on?`<div class="grid">${reqFormHTML()}<div class="card s7" id="pList">${reqListHTML()}</div></div>`:'<div class="card empty">logins are off</div>';}

/* settings: logins & sharing */
function cloudCard(){
  if(!CLOUD.on)return `<div class="card s12" style="background:linear-gradient(160deg,#fffaf7,#fbe9e8)"><div class="row" style="flex-wrap:wrap"><div><div class="ch" style="margin-bottom:6px"><h3>🔐 logins & sharing</h3><span class="pill" style="background:var(--soft)">off</span></div><div style="font-size:13px;color:#6f5c60;max-width:660px;line-height:1.55">Right now oonda lives only in this browser. Turn on logins so Eric can view the board, everyone else can send requests from their own phone and watch them move, and your data syncs live between your devices.</div></div><button class="btn dark" onclick="setupGuide()">turn on logins</button></div></div>`;
  if(CLOUD.role!=='owner')return '';
  const byP={};Object.entries(CLOUD.roles||{}).forEach(([em,v])=>{byP[v.person]=Object.assign({email:em},v);});
  return `<div class="card s12"><div class="ch"><h3>🔐 logins & sharing</h3><span class="lab">signed in as ${esc(CLOUD.user.email)} · ☁ live sync on</span></div>
  <div style="font-size:13px;color:#6f5c60;margin-bottom:12px;line-height:1.55">Add the email each person will sign in with. <b>broker</b> sees your whole board (view only) and can send requests · <b>requester</b> sends requests and sees only their own.</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px">${requesters().map(p=>{const a=byP[p.id]||{};return `<div class="row" data-acc="${p.id}" style="gap:10px;background:var(--soft);border-radius:18px;padding:8px 10px">${av(p.id,34)}<b style="width:64px;flex-shrink:0">${esc(p.name)}</b><input class="inp" style="background:#fff;padding:8px 10px;min-width:0" type="email" placeholder="their email" value="${esc(a.email||'')}"><select class="inp" style="background:#fff;padding:8px 30px 8px 10px;width:auto;flex-shrink:0">${opts([['requester','requester'],['broker','broker']],a.role||(p.id==='eric'?'broker':'requester'))}</select></div>`;}).join('')}</div>
  <div class="row mt14" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn dark" onclick="saveAccess()">save access</button><button class="btn" onclick="copyText(location.href.split('#')[0],'link copied')">🔗 copy the oonda link</button><button class="btn ghost" onclick="signOut()">sign out</button></div></div>`;
}
function setupGuide(){
  modal(`<div class="mh"><h2>turn on logins<span class="ast">𖹭</span></h2><button class="x" onclick="closeM()">✕</button></div>
  <div class="lab" style="margin:-6px 0 12px">about 10 minutes · free · you only do this once</div>
  <ol class="guide">
  <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener"><b>console.firebase.google.com</b></a> → <b>Add project</b> → name it <i>oonda</i> (Analytics can be off).</li>
  <li><b>Build → Authentication → Get started</b>, then turn on <b>Google</b> and <b>Email/Password</b>.</li>
  <li><b>Authentication → Settings → Authorized domains</b> → add the address oonda lives at (e.g. <i>ekeyrealty.github.io</i>).</li>
  <li><b>Build → Firestore Database → Create database</b> → <i>production mode</i> → region <i>asia-southeast1 (Singapore)</i>.</li>
  <li>Type Mae's sign-in email, copy the rules, paste them in <b>Firestore → Rules</b> and press <b>Publish</b>:
    <div class="f mt8"><input id="sgE" placeholder="mae's email" oninput="$('#sgR').value=RULES.replace('PUT-MAE-EMAIL-HERE',this.value.trim().toLowerCase()||'PUT-MAE-EMAIL-HERE')"></div>
    <textarea id="sgR" class="inp" rows="7" style="font-family:var(--mono);font-size:11px" readonly>${esc(RULES)}</textarea><button class="btn sm mt8" onclick="copyText($('#sgR').value,'rules copied')">copy rules</button></li>
  <li><b>Project settings ⚙︎ → Your apps → Web &lt;/&gt;</b> → register <i>oonda</i> → copy the <b>firebaseConfig</b> numbers.</li>
  <li>Open <b>oonda.html</b> (on GitHub, the ✎ edit button), find <b>OONDA_SETUP</b> at the very top, paste the config and Mae's email, and commit.</li>
  <li>Before switching, press <b>back up</b> in settings to download this browser's data. Open the oonda link, sign in as Mae with Google, then <b>restore</b> the backup. Everything moves to the cloud.</li>
  <li>In <b>settings → logins & sharing</b>, add everyone's email, press <b>save access</b> and send them the link.</li></ol>`,'wide');
}

/* ============ boot ============ */
$('#logoSlot').innerHTML=logo(36);
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==='Escape'){closeM();$('#panel').classList.remove('open');}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();const q=$('#qa');if(q)q.focus();else{tasksTab='today';go('tasks');setTimeout(()=>$('#qa')&&$('#qa').focus(),80);}}
  if(e.key==='/'){e.preventDefault();$('#q')&&$('#q').focus();}
});
window.addEventListener('storage',e=>{if(e.key===KEY&&!CLOUD.on){S=load();render();}});
let appStarted=false;
function startApp(ro){
  if(appStarted)return;appStarted=true;
  render();
  setInterval(()=>{tickClocks();updateIsland();},1000);
  if(!ro){setTimeout(engine,1500);setInterval(engine,20000);}
  setInterval(()=>{if(!$('#modalWrap').innerHTML&&!/input|textarea|select/i.test(document.activeElement.tagName))render();},5*60000);
}
if(cloudOn())cloudBoot();else startApp(false);
</script>
